name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  difftest:
    name: 진짜 Redis와 응답 비교
    runs-on: ubuntu-latest
    # 정답지 Redis의 버전을 고정합니다.
    # 에러 문구가 버전마다 다릅니다. 예를 들어 인자 없는 모르는 커맨드에
    #   8.2  → ERR unknown command 'garbage', with args beginning with:
    #   8.10 → ERR unknown command 'garbage'
    # 버전이 다르면 같은 코드가 로컬에서는 통과하고 CI에서는 실패합니다. (실제로 겪었습니다)
    # 로컬 redis-server --version 과 같은 버전으로 맞춰 두세요.
    # difftest.sh 는 6379가 이미 떠 있으면 그걸 정답지로 씁니다.
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: redis-cli 설치
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - run: ./scripts/difftest.sh
